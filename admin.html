<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyyBund Admin Panel</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:20px;
}

.header{
    background:#0A2540;
    color:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#0A2540;
    color:white;
}
</style>
</head>
<body>

<div class="header">
    <h1>SkyyBund Admin Panel</h1>
    <p id="adminEmail">Loading...</p>
</div>

<div class="card">
    <h2>Withdrawal Requests</h2>

    <table>
        <thead>
            <tr>
                <th>Amount</th>
                <th>Bank</th>
                <th>Account Number</th>
                <th>Account Name</th>
            </tr>
        </thead>

        <tbody id="withdrawTable">
        </tbody>
    </table>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuqisoLftS3zK9q4eQL7Of300FkWCwn6w",
  authDomain: "skyybund-5431b.firebaseapp.com",
  projectId: "skyybund-5431b",
  storageBucket: "skyybund-5431b.firebasestorage.app",
  messagingSenderId: "618557553852",
  appId: "1:618557553852:web:6d819ce282a7b875b564b9"
};

const ADMIN_EMAIL = "lainaadavid@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user)=>{

    if(!user){
        window.location.href="login.html";
        return;
    }

    if(user.email !== ADMIN_EMAIL){
        alert("Access Denied");
        window.location.href="dashboard.html";
        return;
    }

    document.getElementById("adminEmail").innerText =
    user.email;

    loadWithdrawals();

});

async function loadWithdrawals(){

    const querySnapshot =
    await getDocs(collection(db,"withdrawals"));

    let html = "";

    querySnapshot.forEach((doc)=>{

        const data = doc.data();

        html += `
        <tr>
            <td>${data.amount || ""}</td>
            <td>${data.bank || ""}</td>
            <td>${data.accountNumber || ""}</td>
            <td>${data.accountName || ""}</td>
        </tr>
        `;

    });

    document.getElementById("withdrawTable").innerHTML =
    html;
}

</script>

</body>
</html>
