<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyyBund Admin Panel</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:20px;
}

header{
background:#0A2540;
color:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.header-content h1{
margin:0;
}

.back-btn{
background:#FFD700;
color:#0A2540;
border:none;
padding:10px 20px;
border-radius:5px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

.back-btn:hover{
background:#FFC700;
transform:scale(1.05);
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tab-btn{
padding:12px 20px;
border:none;
border-radius:5px;
background:#ddd;
color:#0A2540;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.tab-btn.active{
background:#0A2540;
color:#FFD700;
}

.tab-btn:hover{
background:#999;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

table{
width:100%;
border-collapse:collapse;
margin-top:15px;
}

th,td{
border:1px solid #ddd;
padding:10px;
text-align:left;
font-size:13px;
}

th{
background:#0A2540;
color:white;
font-weight:bold;
}

tr:hover{
background:#f9f9f9;
}

.btn-approve,
.btn-decline,
.btn-process{
padding:6px 12px;
border:none;
border-radius:5px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
margin-right:5px;
font-size:12px;
}

.btn-approve{
background:#51CF66;
color:white;
}

.btn-approve:hover{
background:#40C057;
}

.btn-approve:disabled{
opacity:0.5;
cursor:not-allowed;
}

.btn-decline{
background:#FF6B6B;
color:white;
}

.btn-decline:hover{
background:#FA5252;
}

.btn-decline:disabled{
opacity:0.5;
cursor:not-allowed;
}

.btn-process{
background:#1971C2;
color:white;
}

.btn-process:hover{
background:#1864AB;
}

.btn-process:disabled{
opacity:0.5;
cursor:not-allowed;
}

.status{
padding:5px 10px;
border-radius:3px;
font-weight:bold;
font-size:12px;
}

.status.pending{
background:#FFE9AC;
color:#F76707;
}

.status.approved{
background:#C3FAC3;
color:#2B8A3E;
}

.status.declined{
background:#FFB0B0;
color:#C1121F;
}

.status.processing{
background:#B4D7FF;
color:#1971C2;
}

.status.paid{
background:#A8E6CF;
color:#00A854;
}

.no-data{
color:#999;
font-style:italic;
text-align:center;
padding:30px;
}

.error{
background:#FFE9E9;
color:#C1121F;
padding:15px;
border-radius:5px;
margin-bottom:15px;
display:none;
border-left:4px solid #C1121F;
}

.success{
background:#E9FFE9;
color:#2B8A3E;
padding:15px;
border-radius:5px;
margin-bottom:15px;
display:none;
border-left:4px solid #2B8A3E;
}

.loading{
text-align:center;
padding:20px;
color:#0A2540;
}

.loading::after{
content:" •••";
animation:dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
0%, 20% { content:" •"; }
40% { content:" ••"; }
60% { content:" •••"; }
100% { content:" "; }
}

.stats{
display:flex;
gap:15px;
margin-bottom:20px;
flex-wrap:wrap;
}

.stat-box{
background:#E7F5FF;
padding:15px 20px;
border-radius:8px;
border-left:4px solid #0A2540;
flex:1;
min-width:150px;
}

.stat-box h3{
color:#0A2540;
font-size:12px;
}

.stat-box .number{
color:#0A2540;
font-size:24px;
font-weight:bold;
}

.tab-content{
display:none;
}

.tab-content.active{
display:block;
}

.amount{
font-weight:bold;
color:#FF6B6B;
}

/* Modal Styles */
.modal{
display:none;
position:fixed;
z-index:1000;
left:0;
top:0;
width:100%;
height:100%;
background-color:rgba(0,0,0,0.5);
animation:fadeIn 0.3s ease;
}

@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

.modal-content{
background-color:white;
margin:10% auto;
padding:30px;
border-radius:10px;
width:90%;
max-width:500px;
box-shadow:0 4px 20px rgba(0,0,0,0.3);
animation:slideIn 0.3s ease;
}

@keyframes slideIn{
from{
opacity:0;
transform:translateY(-50px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.close{
color:#999;
float:right;
font-size:28px;
font-weight:bold;
cursor:pointer;
}

.close:hover{
color:#000;
}

.modal-form{
margin-top:20px;
}

.form-group{
margin-bottom:15px;
}

.form-group label{
display:block;
color:#0A2540;
font-weight:bold;
margin-bottom:5px;
}

.form-group input,
.form-group select{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:5px;
box-sizing:border-box;
}

.form-group input:focus,
.form-group select:focus{
outline:none;
border-color:#0A2540;
box-shadow:0 0 5px rgba(10, 37, 64, 0.2);
}

.modal-buttons{
display:flex;
gap:10px;
margin-top:20px;
}

.modal-buttons button{
flex:1;
padding:12px;
border:none;
border-radius:5px;
cursor:pointer;
font-weight:bold;
transition:0.3s;
}

.modal-buttons .btn-cancel{
background:#999;
color:white;
}

.modal-buttons .btn-cancel:hover{
background:#777;
}

.modal-buttons .btn-submit{
background:#1971C2;
color:white;
}

.modal-buttons .btn-submit:hover{
background:#1864AB;
}

.modal-buttons .btn-submit:disabled{
opacity:0.5;
cursor:not-allowed;
}
</style>
</head>
<body>

<header>
<div class="header-content">
<h1>🔐 SkyyBund Admin Panel</h1>
<p id="adminEmail">Loading...</p>
</div>
<button class="back-btn" id="backBtn">← Dashboard</button>
</header>

<div id="errorMsg" class="error"></div>
<div id="successMsg" class="success"></div>

<div class="card">
<div class="tabs">
<button class="tab-btn active" data-tab="withdrawals">💸 Withdrawals</button>
<button class="tab-btn" data-tab="deposits">💰 Deposits</button>
</div>

<!-- WITHDRAWALS TAB -->
<div id="withdrawals" class="tab-content active">
<h2>Withdrawal Requests</h2>

<div class="stats" id="withdrawStats"></div>

<div id="withdrawLoadingMsg" class="loading">Loading withdrawals</div>

<table id="withdrawTable" style="display:none;">
<thead>
<tr>
<th>Email</th>
<th>Amount</th>
<th>Bank</th>
<th>Account</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="withdrawTableBody">
</tbody>
</table>

<div id="withdrawNoData" class="no-data" style="display:none;">No withdrawal requests</div>
</div>

<!-- DEPOSITS TAB -->
<div id="deposits" class="tab-content">
<h2>Deposit Requests</h2>

<div class="stats" id="depositStats"></div>

<div id="depositLoadingMsg" class="loading">Loading deposits</div>

<table id="depositTable" style="display:none;">
<thead>
<tr>
<th>Email</th>
<th>Amount</th>
<th>Status</th>
<th>Date</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="depositTableBody">
</tbody>
</table>

<div id="depositNoData" class="no-data" style="display:none;">No deposit requests</div>
</div>

</div>

<!-- PAYMENT PROCESSING MODAL -->
<div id="paymentModal" class="modal">
<div class="modal-content">
<span class="close" onclick="closePaymentModal()">&times;</span>
<h2>Process Payment</h2>
<p id="paymentInfo" style="margin:15px 0; color:#666;"></p>

<div class="modal-form">
<div class="form-group">
<label>Payment Method</label>
<select id="paymentMethod" onchange="updatePaymentFields()">
<option value="">-- Select Payment Method --</option>
<option value="flutterwave">Flutterwave (Automatic)</option>
<option value="paystack">Paystack (Automatic)</option>
<option value="manual">Manual Transfer</option>
</select>
</div>

<div id="flutterwaveFields" style="display:none;">
<div class="form-group">
<label>Recipient Account Number</label>
<input type="text" id="recipientAccount" placeholder="Account number" readonly>
</div>
<div class="form-group">
<label>Recipient Bank</label>
<input type="text" id="recipientBank" placeholder="Bank name" readonly>
</div>
<div class="form-group">
<label>Amount (₦)</label>
<input type="number" id="paymentAmount" placeholder="Amount" readonly>
</div>
</div>

<div id="paystackFields" style="display:none;">
<div class="form-group">
<label>Recipient Account Number</label>
<input type="text" id="paystackAccount" placeholder="Account number" readonly>
</div>
<div class="form-group">
<label>Recipient Bank</label>
<input type="text" id="paystackBank" placeholder="Bank name" readonly>
</div>
<div class="form-group">
<label>Amount (₦)</label>
<input type="number" id="paystackAmount" placeholder="Amount" readonly>
</div>
</div>

<div id="manualFields" style="display:none;">
<div class="form-group">
<label>Transaction Reference/Receipt</label>
<input type="text" id="transactionRef" placeholder="Enter transaction ID or receipt number">
</div>
<div class="form-group">
<label>Notes (Optional)</label>
<input type="text" id="paymentNotes" placeholder="Any additional notes">
</div>
</div>
</div>

<div class="modal-buttons">
<button class="btn-cancel" onclick="closePaymentModal()">Cancel</button>
<button class="btn-submit" id="submitPayment" onclick="submitPayment()">Process Payment</button>
</div>
</div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
collection,
getDocs,
updateDoc,
doc
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyBuqisoLftS3zK9q4eQL7Of300FkWCwn6w",
authDomain: "skyybund-5431b.firebaseapp.com",
projectId: "skyybund-5431b",
storageBucket: "skyybund-5431b.firebasestorage.app",
messagingSenderId: "618557553852",
appId: "1:618557553852:web:6d819ce282a7b875b564b9"
};

const ADMIN_EMAIL = "lainaadavid@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentPaymentData = null;

onAuthStateChanged(auth, async (user)=>{

if(!user){
window.location.href="login.html";
return;
}

if(user.email !== ADMIN_EMAIL){
showError("❌ Access Denied: Admin access only");
setTimeout(()=>{
window.location.href="dashboard.html";
}, 2000);
return;
}

document.getElementById("adminEmail").innerText = user.email;
loadWithdrawals();
loadDeposits();

});

function showError(message){
const errorMsg = document.getElementById("errorMsg");
errorMsg.innerText = message;
errorMsg.style.display = "block";
setTimeout(()=>{
errorMsg.style.display = "none";
}, 5000);
}

function showSuccess(message){
const successMsg = document.getElementById("successMsg");
successMsg.innerText = message;
successMsg.style.display = "block";
setTimeout(()=>{
successMsg.style.display = "none";
}, 3000);
}

async function loadWithdrawals(){
try {
const querySnapshot = await getDocs(collection(db, "withdrawals"));
let html = "";
let hasData = false;
let pending = 0, approved = 0, processing = 0, paid = 0, declined = 0;

querySnapshot.forEach((docSnap)=>{
hasData = true;
const data = docSnap.data();
const status = data.status || "pending";

if(status === "pending") pending++;
if(status === "approved") approved++;
if(status === "processing") processing++;
if(status === "paid") paid++;
if(status === "declined") declined++;

html += `
<tr>
<td>${data.userEmail || "N/A"}</td>
<td class="amount">₦${parseFloat(data.amount || 0).toFixed(2)}</td>
<td>${data.bank || "N/A"}</td>
<td>${data.accountNumber || "N/A"}</td>
<td><span class="status ${status}">${status.toUpperCase()}</span></td>
<td style="min-width:180px;">
<button class="btn-approve" onclick="approveWithdrawal('${docSnap.id}', this)" ${status !== "pending" ? "disabled" : ""}>✓ Approve</button>
<button class="btn-process" onclick="openPaymentModal('${docSnap.id}', '${data.userEmail}', ${data.amount}, '${data.bank}', '${data.accountNumber}')" ${status !== "approved" ? "disabled" : ""}>💳 Process</button>
<button class="btn-decline" onclick="declineWithdrawal('${docSnap.id}', this)" ${status === "paid" || status === "declined" ? "disabled" : ""}>✕ Decline</button>
</td>
</tr>
`;
});

const tbody = document.getElementById("withdrawTableBody");
tbody.innerHTML = html;

// Update stats
document.getElementById("withdrawStats").innerHTML = `
<div class="stat-box"><h3>Pending</h3><div class="number">${pending}</div></div>
<div class="stat-box"><h3>Approved</h3><div class="number">${approved}</div></div>
<div class="stat-box"><h3>Processing</h3><div class="number">${processing}</div></div>
<div class="stat-box"><h3>Paid</h3><div class="number">${paid}</div></div>
<div class="stat-box"><h3>Declined</h3><div class="number">${declined}</div></div>
`;

document.getElementById("withdrawLoadingMsg").style.display = "none";

if(hasData){
document.getElementById("withdrawTable").style.display = "table";
document.getElementById("withdrawNoData").style.display = "none";
} else {
document.getElementById("withdrawTable").style.display = "none";
document.getElementById("withdrawNoData").style.display = "block";
}

} catch(error){
showError("Error loading withdrawals: " + error.message);
document.getElementById("withdrawLoadingMsg").style.display = "none";
}
}

async function loadDeposits(){
try {
const querySnapshot = await getDocs(collection(db, "deposits"));
let html = "";
let hasData = false;
let pending = 0, approved = 0, declined = 0;

querySnapshot.forEach((docSnap)=>{
hasData = true;
const data = docSnap.data();
const status = data.status || "pending";

if(status === "pending") pending++;
if(status === "approved") approved++;
if(status === "declined") declined++;

const date = data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleDateString() : "N/A";

html += `
<tr>
<td>${data.userEmail || "N/A"}</td>
<td class="amount">₦${parseFloat(data.amount || 0).toFixed(2)}</td>
<td><span class="status ${status}">${status.toUpperCase()}</span></td>
<td>${date}</td>
<td style="min-width:120px;">
<button class="btn-approve" onclick="approveDeposit('${docSnap.id}', this)" ${status !== "pending" ? "disabled" : ""}>✓ Approve</button>
<button class="btn-decline" onclick="declineDeposit('${docSnap.id}', this)" ${status !== "pending" ? "disabled" : ""}>✕ Decline</button>
</td>
</tr>
`;
});

const tbody = document.getElementById("depositTableBody");
tbody.innerHTML = html;

// Update stats
document.getElementById("depositStats").innerHTML = `
<div class="stat-box"><h3>Pending</h3><div class="number">${pending}</div></div>
<div class="stat-box"><h3>Approved</h3><div class="number">${approved}</div></div>
<div class="stat-box"><h3>Declined</h3><div class="number">${declined}</div></div>
`;

document.getElementById("depositLoadingMsg").style.display = "none";

if(hasData){
document.getElementById("depositTable").style.display = "table";
document.getElementById("depositNoData").style.display = "none";
} else {
document.getElementById("depositTable").style.display = "none";
document.getElementById("depositNoData").style.display = "block";
}

} catch(error){
showError("Error loading deposits: " + error.message);
document.getElementById("depositLoadingMsg").style.display = "none";
}
}

window.approveWithdrawal = async function(docId, btn){
btn.disabled = true;
try {
await updateDoc(doc(db, "withdrawals", docId), { status: "approved" });
showSuccess("✅ Withdrawal approved! Now click 'Process' to send payment.");
loadWithdrawals();
} catch(error){
showError("Error: " + error.message);
btn.disabled = false;
}
};

window.declineWithdrawal = async function(docId, btn){
btn.disabled = true;
try {
await updateDoc(doc(db, "withdrawals", docId), { status: "declined" });
showSuccess("❌ Withdrawal declined");
loadWithdrawals();
} catch(error){
showError("Error: " + error.message);
btn.disabled = false;
}
};

window.approveDeposit = async function(docId, btn){
btn.disabled = true;
try {
await updateDoc(doc(db, "deposits", docId), { status: "approved" });
showSuccess("✅ Deposit approved!");
loadDeposits();
} catch(error){
showError("Error: " + error.message);
btn.disabled = false;
}
};

window.declineDeposit = async function(docId, btn){
btn.disabled = true;
try {
await updateDoc(doc(db, "deposits", docId), { status: "declined" });
showSuccess("❌ Deposit declined");
loadDeposits();
} catch(error){
showError("Error: " + error.message);
btn.disabled = false;
}
};

window.openPaymentModal = function(docId, email, amount, bank, account){
currentPaymentData = {docId, email, amount, bank, account};
document.getElementById("paymentInfo").innerHTML = `
<strong>User:</strong> ${email}<br>
<strong>Amount:</strong> ₦${parseFloat(amount).toFixed(2)}<br>
<strong>Bank:</strong> ${bank}<br>
<strong>Account:</strong> ${account}
`;
document.getElementById("recipientAccount").value = account;
document.getElementById("recipientBank").value = bank;
document.getElementById("paymentAmount").value = parseFloat(amount).toFixed(2);
document.getElementById("paystackAccount").value = account;
document.getElementById("paystackBank").value = bank;
document.getElementById("paystackAmount").value = parseFloat(amount).toFixed(2);
document.getElementById("paymentModal").style.display = "block";
};

window.closePaymentModal = function(){
document.getElementById("paymentModal").style.display = "none";
document.getElementById("paymentMethod").value = "";
document.getElementById("transactionRef").value = "";
document.getElementById("paymentNotes").value = "";
updatePaymentFields();
};

window.updatePaymentFields = function(){
const method = document.getElementById("paymentMethod").value;
document.getElementById("flutterwaveFields").style.display = method === "flutterwave" ? "block" : "none";
document.getElementById("paystackFields").style.display = method === "paystack" ? "block" : "none";
document.getElementById("manualFields").style.display = method === "manual" ? "block" : "none";
};

window.submitPayment = async function(){
const method = document.getElementById("paymentMethod").value;

if(!method){
showError("Please select a payment method");
return;
}

if(!currentPaymentData){
showError("No payment data selected");
return;
}

const btn = document.getElementById("submitPayment");
btn.disabled = true;

try {

if(method === "flutterwave"){
// Flutterwave API call
alert("🔄 Initiating Flutterwave payment...\n\nIn production, this would automatically transfer ₦" + currentPaymentData.amount);
} else if(method === "paystack"){
// Paystack API call
alert("🔄 Initiating Paystack payment...\n\nIn production, this would automatically transfer ₦" + currentPaymentData.amount);
} else if(method === "manual"){
const ref = document.getElementById("transactionRef").value;
if(!ref){
showError("Please enter transaction reference");
btn.disabled = false;
return;
}
}

// Update status to processing
await updateDoc(doc(db, "withdrawals", currentPaymentData.docId), {
status: "processing",
paymentMethod: method,
transactionRef: method === "manual" ? document.getElementById("transactionRef").value : "auto-" + Date.now(),
paymentNotes: document.getElementById("paymentNotes").value || "",
processedAt: new Date(),
processedBy: document.getElementById("adminEmail").innerText
});

showSuccess("✅ Payment " + (method === "manual" ? "recorded" : "processing") + "! Status updated to 'Processing'.");
closePaymentModal();
loadWithdrawals();

} catch(error){
showError("Error processing payment: " + error.message);
} finally {
btn.disabled = false;
}

};

// Tab switching
document.querySelectorAll(".tab-btn").forEach(btn => {
btn.addEventListener("click", ()=>{
document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));

btn.classList.add("active");
document.getElementById(btn.dataset.tab).classList.add("active");
});
});

document.getElementById("backBtn").addEventListener("click", ()=>{
window.location.href="dashboard.html";
});

// Close modal when clicking outside
window.onclick = function(event){
const modal = document.getElementById("paymentModal");
if(event.target == modal){
modal.style.display = "none";
}
};

</script>

</body>
</html>
