<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SKYBUND</title>
</head>

<body>

  <h1>SKYBUND Withdrawal System</h1>

  <!-- WITHDRAW FORM -->
  <div>
    <input id="amount" type="number" placeholder="Amount" />
    <input id="bank" type="text" placeholder="Bank Name" />
    <input id="account" type="text" placeholder="Account Number" />

    <button id="withdrawBtn">Request Withdrawal</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // 🔥 YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      databaseURL: "YOUR_DATABASE_URL",
      appId: "YOUR_APP_ID"
    };

    // INIT FIREBASE
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // BUTTON CLICK → SEND WITHDRAWAL
    document.getElementById("withdrawBtn").addEventListener("click", () => {

      const amount = document.getElementById("amount").value;
      const bank = document.getElementById("bank").value;
      const account = document.getElementById("account").value;

      if (!amount || !bank || !account) {
        alert("Please fill all fields");
        return;
      }

      push(ref(db, "withdrawals"), {
        amount: amount,
        bank: bank,
        account: account,
        status: "pending",
        time: Date.now()
      });

      alert("Withdrawal request received 🚀");
    });

  </script>

</body>
</html>
