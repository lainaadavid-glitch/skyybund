<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw - SkyyBund</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:20px;
}

.card{
max-width:600px;
margin:auto;
background:white;
padding:25px;
border-radius:10px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#0A2540;
color:white;
border:none;
cursor:pointer;
}
</style>
</head>
<body>

<div class="card">

<h1>Withdrawal Request</h1>

<input id="amount" type="number" placeholder="Amount">

<input id="bank" type="text" placeholder="Bank Name">

<input id="accountNumber" type="text" placeholder="Account Number">

<input id="accountName" type="text" placeholder="Account Name">

<button id="submitBtn">
Submit Request
</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBuqisoLftS3zK9q4eQL7Of300FkWCwn6w",
  authDomain: "skyybund-5431b.firebaseapp.com",
  projectId: "skyybund-5431b",
  storageBucket: "skyybund-5431b.firebasestorage.app",
  messagingSenderId: "618557553852",
  appId: "1:618557553852:web:6d819ce282a7b875b564b9"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document
.getElementById("submitBtn")
.addEventListener("click", async ()=>{

try{

await addDoc(
collection(db,"withdrawals"),
{
amount:
document.getElementById("amount").value,

bank:
document.getElementById("bank").value,

accountNumber:
document.getElementById("accountNumber").value,

accountName:
document.getElementById("accountName").value,

createdAt:
serverTimestamp()
}
);

alert("Withdrawal Request Submitted");

}catch(error){

alert(error.message);

}

});

</script>

</body>
</html>
